services:
  taskspark:
    image: ghcr.io/d1same/taskspark:latest
    # To build this folder instead of pulling, uncomment the next line.
    # build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATA_DIR: /data
      TZ: America/New_York
    volumes:
      - taskspark:/data
    restart: unless-stopped

volumes:
  taskspark:
