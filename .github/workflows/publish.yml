name: Publish image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Publish ghcr.io/d1same/taskspark
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short sha
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Version
        id: version
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          echo "semver=$version" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/d1same/taskspark:latest
            ghcr.io/d1same/taskspark:${{ steps.version.outputs.semver }}
            ghcr.io/d1same/taskspark:${{ steps.sha.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/d1same/Taskspark
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.semver }}

      - name: Check the image is public
        run: |
          set -eu
          python3 - <<'PY'
          import json, urllib.request, urllib.error, sys

          def fetch(url, headers=None):
              req = urllib.request.Request(url, headers=headers or {})
              try:
                  with urllib.request.urlopen(req) as res:
                      return res.status, res.read()
              except urllib.error.HTTPError as err:
                  return err.code, err.read()

          status, body = fetch("https://ghcr.io/token?service=ghcr.io&scope=repository:d1same/taskspark:pull")
          token = json.loads(body).get("token") if status == 200 else ""
          if not token:
              sys.exit("anonymous pull was refused")
          accept = "application/vnd.oci.image.index.v1+json"
          status, body = fetch(
              "https://ghcr.io/v2/d1same/taskspark/manifests/latest",
              {"Authorization": "Bearer " + token, "Accept": accept},
          )
          if status != 200:
              sys.exit(f"anonymous pull failed with HTTP {status}")
          platforms = set()
          for item in json.loads(body).get("manifests", []):
              plat = item.get("platform") or {}
              platforms.add(f"{plat.get('os')}/{plat.get('architecture')}")
          needed = {"linux/amd64", "linux/arm64"}
          if not needed <= platforms:
              sys.exit("image is missing linux/amd64 or linux/arm64")
          print("public image has linux/amd64 and linux/arm64")
          PY
