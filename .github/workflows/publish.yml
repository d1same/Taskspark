name: Publish image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Publish ghcr.io/d1same/taskspark
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short sha
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/d1same/taskspark:latest
            ghcr.io/d1same/taskspark:${{ steps.sha.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/d1same/Taskspark
            org.opencontainers.image.licenses=MIT

      - name: Make the package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          for attempt in 1 2 3 4 5 6; do
            if gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              /users/d1same/packages/container/taskspark \
              -f visibility=public >/tmp/taskspark-visibility.json; then
              exit 0
            fi
            sleep 10
          done
          cat /tmp/taskspark-visibility.json
          exit 1
